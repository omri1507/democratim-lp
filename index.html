<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>הדמוקרטים צריכים אתכם! · התנדבו איתנו ביום הבחירות</title>
<meta name="description" content="הדמוקרטים בראשות יאיר גולן — התנדבו איתנו ביום הבחירות. מביאים כל קול.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="root">

  <!-- ============================ HERO ============================ -->
  <section class="band band--hero">
    <div class="hero-bg" aria-hidden="true"></div>
    <div class="inner">
      <img class="hero-golan" src="assets/img/golan.webp" alt="יאיר גולן">
      <img class="hero-logo" src="assets/svg/logo.svg" alt="הדמוקרטים בראשות יאיר גולן">

      <!-- one shared shear on the column, so the stack and the button sit on
           the same plane (shearing them separately misaligns the button) -->
      <div class="hero-cta skew">
        <div class="hero-cta__stack">
          <div class="box box--lightblue hero-title">
            <img src="assets/svg/hero-title.svg" alt="הדמוקרטים צריכים אתכם!">
          </div>
          <div class="box box--white hero-sub">
            <img src="assets/svg/hero-sub.svg" alt="התנדבו איתנו ביום הבחירות">
          </div>
        </div>
        <a href="#join" class="btn btn--red hero-btn">
          <img class="btn__chev" src="assets/svg/chevron.svg" alt="">
          <img class="btn__label" src="assets/svg/hero-btn.svg" alt="להרשמה">
        </a>
      </div>
    </div>
  </section>

  <!-- ============================ MARQUEE ============================ -->
  <div class="marquee" aria-hidden="true">
    <div class="marquee__bar">
      <!-- the two accent lines hang outside the bar, so they sit beside the
           clipped track rather than inside it -->
      <span class="marquee__stripe marquee__stripe--a"></span>
      <span class="marquee__stripe marquee__stripe--b"></span>
      <div class="marquee__clip">
        <div class="marquee__track">
          <div class="marquee__seq"></div>
          <div class="marquee__seq"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ======================= LIGHT-BLUE SECTION ======================= -->
  <div class="blue-bg" aria-hidden="true"></div>
  <section class="band band--blue">
    <div class="inner">

      <img class="mid-youngman parallax" data-depth="0.045" src="assets/img/youngman.webp" alt="דמוקרט מתנדב מחזיק פתק אמת">
      <div class="mid-booth parallax" data-depth="0.09">
        <img src="assets/img/booth.webp" alt="דוכן הדמוקרטים">
      </div>

      <div class="duknow skew parallax" data-depth="-0.03">
        <div class="box box--white duknow__fact reveal">
          <img src="assets/svg/fact.svg" alt="5-6% מהבוחרים מחליטים למי להצביע מול הקלפי עצמה">
        </div>
        <a href="#join" class="btn btn--red duknow__cta">
          <img class="btn__chev" src="assets/svg/chevron.svg" alt="">
          <img class="btn__label" src="assets/svg/boau.svg" alt="בואו להשפיע">
        </a>
      </div>
    </div>
  </section>

  <!-- ============================ NAVY BAND ============================ -->
  <div class="navy" aria-hidden="true">
    <div class="navy__slab"></div>
    <span class="navy__stripe navy__stripe--a"></span>
    <span class="navy__stripe navy__stripe--b"></span>
  </div>

  <section class="band band--navy">
    <div class="inner">

      <!-- progress towards the volunteer target.
           ONE number drives everything: data-pct on .count sets the inline
           --pct (so the bar is already the right width with JS off) and is
           the value the bar counts up to. Change it here, or at runtime with
           window.setProgress(n). -->
      <div class="count skew" data-pct="45" style="--pct:45">
        <div class="box box--navy count__tag">
          <img src="assets/svg/adkan.svg" alt="עד כה נרשמו">
        </div>
        <div class="box box--white count__num">
          <div class="bar" role="progressbar"
               aria-valuemin="0" aria-valuemax="100" aria-valuenow="45"
               aria-label="אחוז מהמתנדבות והמתנדבים הנדרשים שנרשמו">
            <span class="bar__fill"></span>
            <!-- Live text: js/main.js swaps this for an inline <svg> composed
                 from the Mandatory outlines in assets/js/mandatory-digits.js,
                 so the percentage can animate in the real face. -->
            <span class="bar__pct" aria-hidden="true">45%</span>
          </div>
          <img class="count__note" src="assets/svg/nidrashim.svg"
               alt="מהמתנדבות והמתנדבים הנדרשים">
        </div>
      </div>

      <!-- form -->
      <form id="join" class="form reveal" novalidate>
        <div class="box box--lightblue form__head skew">
          <img src="assets/svg/hitstarfu.svg" alt="הצטרפו עכשיו:">
        </div>

        <div class="form__row">
          <label class="field skew">
            <span class="field__label">שם פרטי</span>
            <input type="text" name="first" autocomplete="given-name">
          </label>
          <label class="field skew">
            <span class="field__label">שם משפחה</span>
            <input type="text" name="last" autocomplete="family-name">
          </label>
          <label class="field skew">
            <span class="field__label">טלפון</span>
            <input type="tel" name="phone" autocomplete="tel">
          </label>
        </div>

        <div class="form__row form__row--2">
          <label class="field skew">
            <span class="field__label">אימייל</span>
            <input type="email" name="email" autocomplete="email">
          </label>
          <label class="field skew">
            <span class="field__label">עיר מגורים</span>
            <input type="text" name="city" autocomplete="address-level2">
          </label>
        </div>

        <div class="form__consent skew">
          <span class="checkbox" role="checkbox" aria-checked="false" tabindex="0"></span>
          <span class="form__consent-text">אני מאשר/ת את
            <a href="https://democrats.org.il/privacy-policy/" target="_blank" rel="noopener">תנאי השימוש ומדיניות הפרטיות</a><b>*</b>
          </span>
        </div>

        <button type="submit" class="btn btn--red form__submit skew">
          <img class="btn__chev" src="assets/svg/chevron.svg" alt="">
          <img class="btn__label" src="assets/svg/shlicha.svg" alt="שליחה">
        </button>
        <p class="form__done" hidden>תודה! פרטיך נקלטו.</p>
      </form>

      <img class="navy-logo" src="assets/svg/logo.svg" alt="הדמוקרטים בראשות יאיר גולן">

      <!-- Profile links lifted from the footer of democrats.org.il, with their
           share/tracking query strings (mibextid, igsh, s, _t/_r) stripped —
           those are artefacts of however the links were first pasted, not part
           of the address. Inline SVG rather than <img> so the glyphs can take
           the brand blue on hover via currentColor. -->
      <ul class="social">
        <li><a href="https://www.facebook.com/share/1ZGPEPbquF/" target="_blank" rel="noopener noreferrer" aria-label="הדמוקרטים בפייסבוק">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M13.5 21v-8h2.69l.4-3.12H13.5V7.9c0-.9.25-1.52 1.55-1.52h1.65V3.59c-.29-.04-1.27-.13-2.42-.13-2.4 0-4.04 1.46-4.04 4.15v2.31H7.54V13h2.7v8h3.26Z"/></svg>
        </a></li>
        <li><a href="https://www.instagram.com/hademocratimil" target="_blank" rel="noopener noreferrer" aria-label="הדמוקרטים באינסטגרם">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7.8 2h8.4A5.8 5.8 0 0 1 22 7.8v8.4a5.8 5.8 0 0 1-5.8 5.8H7.8A5.8 5.8 0 0 1 2 16.2V7.8A5.8 5.8 0 0 1 7.8 2Zm0 2A3.8 3.8 0 0 0 4 7.8v8.4A3.8 3.8 0 0 0 7.8 20h8.4a3.8 3.8 0 0 0 3.8-3.8V7.8A3.8 3.8 0 0 0 16.2 4H7.8Zm4.2 3a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6Zm5.4-3.4a1.2 1.2 0 1 1 0 2.4 1.2 1.2 0 0 1 0-2.4Z"/></svg>
        </a></li>
        <li><a href="https://x.com/democratsil" target="_blank" rel="noopener noreferrer" aria-label="הדמוקרטים ב-X">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M18.24 2.25h3.31l-7.23 8.26 8.5 11.24h-6.66l-5.21-6.82-5.97 6.82H1.68l7.73-8.84L1.25 2.25h6.83l4.71 6.23 5.45-6.23Zm-1.16 17.52h1.83L7.08 4.13H5.12l11.96 15.64Z"/></svg>
        </a></li>
        <li><a href="https://www.tiktok.com/@hademocratim" target="_blank" rel="noopener noreferrer" aria-label="הדמוקרטים בטיקטוק">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M16.6 5.82A4.28 4.28 0 0 1 15.54 3h-3.09v12.4a2.59 2.59 0 1 1-2.59-2.6c.27 0 .53.04.78.12V9.66a5.7 5.7 0 1 0 5.06 5.66V9.01a7.35 7.35 0 0 0 4.3 1.38V7.3a4.36 4.36 0 0 1-3.4-1.48Z"/></svg>
        </a></li>
      </ul>

      <div class="footnote">
        <p>הדמוקרטים בראשות יאיר גולן 2026 &copy; כל הזכויות שמורות</p>
        <p>האתר עוצב ופותח על ידי
          <a href="https://omrifeinstein.com" target="_blank" rel="noopener">עומרי פיינשטיין</a>
        </p>
      </div>
    </div>
  </section>

</div>
<script src="assets/js/mandatory-digits.js"></script>
<script src="js/main.js"></script>
</body>
</html>
